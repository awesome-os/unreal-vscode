name: Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<package.json version>)'
        required: false

permissions:
  contents: write

jobs:
  release:
    uses: awesome-os/maintenance-workflows/.github/workflows/reusable-vsix-release.yml@main
    with:
      setup_zig: true
      tag: ${{ inputs.tag }}
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
